spring:
  application:
    name: 'hybrid-rag'
server:
  port: 8080
  # Trust X-Forwarded-* headers from the HTTPS proxy (e.g. AWS Lightsail) so generated
  # URLs, redirects and the OpenAPI server URL use https instead of http.
  forward-headers-strategy: framework
openai:
  api-key: ${OPENAI_API_KEY}
qdrant:
  api-key: ${QDRANT_API_KEY}
  url: ${QDRANT_URL}
  collection: 'stackoverflow'
rag:
  openai-model: ${OPENAI_MODEL:gpt-4.1-mini}
logging:
  level:
    io.github.mrmtd.rag: ${LOG_LEVEL:DEBUG}
springdoc:
  swagger-ui:
    path: /swagger
